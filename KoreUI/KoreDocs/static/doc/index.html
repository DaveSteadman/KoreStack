<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoreStack</title>
  <link rel="icon" type="image/x-icon" href="/ui-elements/assets/icons/favicon.ico" />
  <link rel="stylesheet" href="/static/doc/style.css?v=20261011d" />
  <link rel="stylesheet" href="/static/shared/css/save-status.css?v=20261117a" />
  <link rel="stylesheet" href="/static/shared/css/proposal-panel.css?v=20261117a" />
  <link rel="stylesheet" href="/ui-elements/assets/css/chrome.css?v=20261105d" />
  <script src="/suite-config.js"></script>
</head>
<body class="kcui-shell-bg">

  <div id="topbar"></div>

  <!-- -- Top Bar --------------------------------------------- -->
  <div id="tab-bar"></div>

  <!-- -- Application Menu Bar -------------------------------- -->
  <div id="app-menu-host"></div>

  <!-- -- Formatting Toolbar ------------------------------------ -->
  <div id="toolbar">
    <button class="tb-btn" data-insert="h1" title="Heading 1">H1</button>
    <button class="tb-btn" data-insert="h2" title="Heading 2">H2</button>
    <button class="tb-btn" data-insert="h3" title="Heading 3">H3</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-insert="bold"   title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" data-insert="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn" data-insert="code"   title="Inline Code"><code>`c`</code></button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-insert="indent" type="button" title="Indent (Tab)" aria-label="Indent paragraph">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 5h14M3 10h8M3 15h14M14 8l3 2-3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tb-btn" data-insert="outdent" type="button" title="Outdent (Shift+Tab)" aria-label="Outdent paragraph">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 5h14M9 10h8M3 15h14M6 8l-3 2 3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-insert="ul" type="button" title="Bullet List" aria-label="Bullet list">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <circle cx="4" cy="5" r="1" fill="currentColor"/><circle cx="4" cy="10" r="1" fill="currentColor"/><circle cx="4" cy="15" r="1" fill="currentColor"/>
        <path d="M8 5h9M8 10h9M8 15h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="tb-btn" data-insert="ol" title="Numbered List">1.</button>
    <button class="tb-btn" data-insert="code-block" title="Code Block">```</button>
    <button class="tb-btn" data-insert="hr" type="button" title="Horizontal Rule" aria-label="Insert horizontal rule">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 10h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btn-toggle-sidebar" class="kcui-tag kcui-tag--dim" type="button"
            aria-controls="right-sidebar" aria-pressed="true">details</button>
  </div>

  <!-- -- Main --------------------------------------------------- -->
  <div id="main">

    <div id="editor-area">
      <div id="editor-host"></div>
    </div>

    <aside id="right-sidebar">
      <section id="properties-panel">
        <h3>Properties</h3>
        <div id="props-content"><span class="hint">No document open.</span></div>
      </section>
      <section id="map-panel">
        <h3>Document Map</h3>
        <div id="map-content"><span class="map-empty">No headings yet.</span></div>
      </section>
      <section id="agent-proposals-panel">
        <h3>Agent proposals</h3>
        <div id="agent-proposals"></div>
      </section>
    </aside>

  </div>

  <!-- -- Status Bar ------------------------------------------- -->
  <div id="status-bar">
    <span id="status-file">Untitled.koredoc</span>
    <span id="status-pos"></span>
    <span id="status-counts"></span>
  </div>

  <script type="module" src="/static/doc/js/main.js?v=20261117a"></script>
</body>
</html>
