<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoreStack</title>
  <link rel="icon" type="image/svg+xml" href="/ui-elements/assets/icons/dazzle-line/layer-group-svgrepo-com.svg" />
  <link rel="stylesheet" href="/static/diag/style.css?v=20261118c" />
  <link rel="stylesheet" href="/static/shared/css/save-status.css?v=20261117a" />
  <link rel="stylesheet" href="/ui-elements/assets/css/chrome.css?v=20261105d" />
  <script src="/suite-config.js"></script>
</head>
<body class="kcui-shell-bg">

  <div id="topbar"></div>

  <!-- ── Top Bar ───────────────────────────────────────────── -->
  <div id="tab-bar"></div>

  <!-- ── Application Menu Bar ─────────────────────────────── -->
  <div id="app-menu-host"></div>

  <!-- ── Main workspace ───────────────────────────────────── -->
  <div id="workspace">

    <!-- Left tool sidebar -->
    <aside id="tool-sidebar">
      <button class="tool-btn active" data-tool="select" title="Select / Move (V)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/cursor-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/rectangle-wide-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="rounded" title="Rounded rectangle (U)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/rectangle-wide-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse (E)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/circle-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="diamond" title="Diamond (D)">
        <span class="kcui-icon" aria-hidden="true" style="font:20px/1 system-ui">◇</span>
      </button>
      <button class="tool-btn" data-tool="polygon" title="Polygon — click vertices, Enter to finish (P)">
        <span class="kcui-icon" aria-hidden="true" style="font:20px/1 system-ui">⬠</span>
      </button>
      <button class="tool-btn" data-tool="text" title="Text (T)">
        <span class="kcui-icon" aria-hidden="true" style="font:700 19px/1 system-ui">T</span>
      </button>
      <button class="tool-btn" data-tool="connect" title="Connect (C)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/arrow-up-right-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="waypoint" title="Waypoint (W)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/dazzle-line/crosshair-simple-svgrepo-com.svg)"></span>
      </button>
      <button class="tool-btn" data-tool="pan" title="Pan (H)">
        <span class="kcui-icon kcui-icon--asset" aria-hidden="true" style="--kcui-icon-size:20px;--kcui-icon-url:url(/ui-elements/assets/icons/Gentlecons/hand-svgrepo-com.svg)"></span>
      </button>
    </aside>

    <!-- Canvas -->
    <main id="canvas-container">
      <canvas id="canvas"></canvas>
      <!-- Floating inline text editor -->
      <textarea id="label-editor" style="display:none"></textarea>
    </main>

    <!-- Right panels -->
    <aside id="right-sidebar">
      <section id="properties-panel">
        <h3 id="props-title">Properties</h3>
        <div id="props-content">
          <p class="hint">Nothing selected</p>
        </div>
      </section>

      <section id="hierarchy-panel">
        <h3>Hierarchy</h3>
        <ul id="hierarchy-tree"></ul>
      </section>
    </aside>

  </div>

  <script type="module" src="/static/diag/js/main.js?v=20261118f"></script>
</body>
</html>
