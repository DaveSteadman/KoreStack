<!DOCTYPE html>
{% set req_pfx = _pfx or ('/graph' if request.url.path.startswith('/graph/') else '') %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoreGraph{% block title_suffix %}{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/ui-elements/assets/icons/favicon.ico">
  <link rel="stylesheet" href="/ui-elements/assets/css/chrome.css">
  <link rel="stylesheet" href="{{ req_pfx }}/static/graph/graph-shell.css">
  <script src="/suite-config.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="kcui-shell-bg koregraph-shell">
  <div id="topbar"></div>
  <div id="app-bar"></div>
  <div id="sub-bar"></div>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
  window._kgPfx = {{ req_pfx | tojson }};
  </script>
  <script type="module">
    import { initAppBar, initKoreDataShell, installNumberStepperGlobals } from '/ui-elements/assets/js/chrome.js';

    installNumberStepperGlobals();

    initKoreDataShell({
      path: {{ request.url.path | tojson }},
      urls: window.__koreSuiteUrls || {},
      section: 'graph',
      graphBaseOverride: '{{ req_pfx }}',
      appBarOptions: {
        mountId: 'app-bar',
      },
    });
    initAppBar({
      mountId: 'sub-bar',
      tabs: [
        { label: 'Vocab',       href: '{{ req_pfx }}/ui/vocab',       active: {{ 'true' if request.url.path.endswith('/ui/vocab') else 'false' }} },
        { label: 'Connections', href: '{{ req_pfx }}/ui/connections', active: {{ 'true' if request.url.path.endswith('/ui/connections') else 'false' }} },
        { label: 'Graph',       href: '{{ req_pfx }}/ui/graph',       active: {{ 'true' if request.url.path.endswith('/ui/graph') else 'false' }} },
        { label: 'Processing',  href: '{{ req_pfx }}/ui/processing',  active: {{ 'true' if request.url.path.endswith('/ui/processing') else 'false' }} },
      ],
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
