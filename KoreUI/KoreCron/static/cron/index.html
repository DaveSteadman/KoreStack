<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KoreCron</title>
  <link rel="icon" href="/ui-elements/assets/icons/favicon.ico">
  <link rel="stylesheet" href="/ui-elements/assets/css/chrome.css">
  <link rel="stylesheet" href="/ui-elements/assets/css/workspace.css">
  <script src="/suite-config.js"></script>
</head>
<body class="kcui-shell-bg">
  <div id="topbar"></div>
  <div id="app-bar"></div>
  <main class="kcui-main">
    <div class="kcui-page">
      <section class="kcui-workspace kcui-workspace--two-columns kcui-workspace--stack-sm">
        <div class="kcui-workspace__region">
          <section class="kcui-panel panel">
            <div class="kcui-panel-header"><p class="eyebrow">Cron Prompts</p><p>Select a timed event on the left to load its schedule, destination chat, and prompt sequence into the editor.</p></div>
            <div class="kcui-panel-body">
              <div class="cronprompt-toolbar">
                <button id="create-cronprompt" class="kcui-tag kcui-tag--accent kcui-tag--filled" type="button">New timed event</button>
                <span id="list-status" class="kcui-tag kcui-tag--dim">Select a timed event</span>
              </div>
              <div id="cron-rows" class="cronprompt-list" role="list"><div class="cronprompt-list__empty">Loading...</div></div>
            </div>
          </section>
        </div>
        <div class="kcui-workspace__region">
          <section class="kcui-panel panel">
            <div class="kcui-panel-header"><p id="editor-eyebrow" class="eyebrow">New Timed Event</p><p id="editor-blurb">Name the event, choose its destination chat and schedule, then add the prompts in execution order.</p></div>
            <div class="kcui-panel-body">
              <form id="cronprompt-form">
                <label class="kcui-form-label" for="cron-name">Event name</label>
                <input id="cron-name" name="name" type="text" maxlength="120" placeholder="Daily AI News" required>
                <label class="kcui-form-label" for="chat-name">KoreChat name</label>
                <div class="cronprompt-chat-row">
                  <input id="chat-name" name="chat_name" type="text" placeholder="Daily Research">
                  <button id="agent-resume-btn" class="kcui-tag kcui-tag--warning" type="button">agent resume</button>
                </div>
                <label class="kcui-form-label" for="schedule">Schedule</label>
                <input id="schedule" name="schedule" type="text" placeholder="60 for every 60 minutes, or 08:30 for daily" required>
                <label class="kcui-checkbox-label"><input id="clear-working-data" name="clear_working_data" type="checkbox" checked> Clear scratchpad, temporary datasets, and tool selection before each run</label>
                <label class="kcui-form-label">Prompt sequence</label>
                <div id="prompt-list"></div>
                <div>
                  <button id="add-prompt" class="kcui-tag kcui-tag--dim" type="button">Add prompt</button>
                  <button id="cancel-edit" class="kcui-tag kcui-tag--dim" type="button" hidden>Clear selection</button>
                  <button id="save-cronprompt" class="kcui-tag kcui-tag--accent kcui-tag--filled" type="submit">Create timed event</button>
                  <span id="form-status" class="kcui-tag kcui-tag--dim">Ready</span>
                </div>
              </form>
            </div>
          </section>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/static/cron/app.js?v=20260818-prompt-row-actions"></script>
</body>
</html>
