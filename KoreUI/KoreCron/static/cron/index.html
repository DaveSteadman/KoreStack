<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KoreCron</title>
  <link rel="icon" href="/ui-elements/assets/icons/favicon.ico">
  <link rel="stylesheet" href="/ui-elements/assets/css/chrome.css">
  <link rel="stylesheet" href="/ui-elements/assets/css/workspace.css">
  <script src="/suite-config.js"></script>
</head>
<body class="kcui-shell-bg">
  <div id="topbar"></div>
  <div id="app-bar"></div>
  <main class="kcui-main">
    <div class="kcui-page">
      <section class="kcui-workspace kcui-workspace--two-columns kcui-workspace--stack-sm">
        <div class="kcui-workspace__region">
          <section class="kcui-panel panel">
            <div class="kcui-panel-header"><p class="eyebrow">Triggers</p><p>Select a trigger to see its details. KoreCron only starts the target; the target does the work.</p></div>
            <div class="kcui-panel-body">
              <div class="cron-toolbar">
                <button id="new-trigger" class="kcui-tag kcui-tag--accent kcui-tag--filled" type="button">New trigger</button>
              </div>
              <div id="trigger-rows" class="cron-list" role="list"><div class="cron-list__empty">Loading...</div></div>
            </div>
          </section>
        </div>
        <div class="kcui-workspace__region">
          <section class="kcui-panel panel">
            <div class="kcui-panel-header"><p id="detail-eyebrow" class="eyebrow">Details</p><p id="detail-blurb">Select a trigger on the left, or create a new one.</p></div>
            <div class="kcui-panel-body">
              <div id="detail-empty" class="cron-list__empty">No trigger selected.</div>
              <form id="trigger-form" hidden>
                <label class="kcui-form-label" for="trigger-name">Name</label>
                <input id="trigger-name" type="text" maxlength="120" placeholder="Nightly tests" required>
                <label class="kcui-form-label" for="trigger-target">Target</label>
                <select id="trigger-target"></select>
                <label class="kcui-form-label" for="trigger-schedule">Schedule</label>
                <input id="trigger-schedule" type="text" placeholder="60 for every 60 minutes, or 08:30 for daily" required>
                <label class="kcui-form-label cron-enabled"><input id="trigger-enabled" type="checkbox" checked> Enabled</label>
                <dl id="trigger-info" class="cron-info"></dl>
                <div class="cron-actions">
                  <button id="trigger-save" class="kcui-tag kcui-tag--accent kcui-tag--filled" type="submit">Create trigger</button>
                  <button id="trigger-run" class="kcui-tag kcui-tag--warning" type="button">Run now</button>
                  <button id="trigger-delete" class="kcui-tag kcui-tag--dim" type="button">Delete</button>
                  <span id="form-status" class="kcui-tag kcui-tag--dim">Ready</span>
                </div>
              </form>
            </div>
          </section>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/static/cron/app.js?v=1791355700"></script>
</body>
</html>
